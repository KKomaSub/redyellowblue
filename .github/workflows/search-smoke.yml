name: Search endpoint diagnostics

on:
  push:
    paths:
      - '.github/workflows/search-smoke.yml'
      - 'functions/api/search.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public search providers and deployed endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          targets = {
            'production': 'https://wryb.pages.dev/api/search?q=chatgpt&period=all&sort=relevance',
            'pullpush': 'https://api.pullpush.io/reddit/search/submission/?q=chatgpt&size=3',
            'arctic_shift': 'https://arctic-shift.photon-reddit.com/api/posts/search?query=chatgpt&limit=3&sort=desc',
            'bing_rss': 'https://www.bing.com/search?format=rss&q=site%3Areddit.com+chatgpt',
            'google_news_rss': 'https://news.google.com/rss/search?q=site%3Areddit.com+chatgpt&hl=en-US&gl=US&ceid=US%3Aen',
          }
          for name,url in targets.items():
            try:
              req = Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; FindlySearchHealth/1.0)', 'Accept':'application/json, application/rss+xml, text/xml'})
              with urlopen(req, timeout=12) as response:
                sample=response.read(160).decode('utf-8','replace').replace('\n',' ')
                print(name, response.status, response.headers.get('content-type'), sample)
            except HTTPError as exc:
              print(name,'HTTP',exc.code,exc.read(140).decode('utf-8','replace').replace('\n',' '))
            except Exception as exc:
              print(name,type(exc).__name__,str(exc)[:120])
          PY

      - name: Verify search result feed contents
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error
          import xml.etree.ElementTree as ET
          cases = {
            "bing_exact": ("https://www.bing.com/search",{"q":"site:reddit.com/r/ chatgpt","format":"rss","count":"50"}),
            "bing_broad": ("https://www.bing.com/search",{"q":"site:reddit.com chatgpt","format":"rss","count":"50"}),
            "reddit_rss": ("https://www.reddit.com/search.rss",{"q":"chatgpt","sort":"relevance"}),
            "arctic_scoped": ("https://arctic-shift.photon-reddit.com/api/posts/search",{"subreddit":"ChatGPT","query":"chatgpt","limit":"3"}),
          }
          for label,(origin, params) in cases.items():
            try:
              req=urllib.request.Request(origin+"?"+urllib.parse.urlencode(params),headers={"User-Agent":"Mozilla/5.0 (compatible; FindlyHealth/1.0)","Accept":"application/rss+xml, application/json"})
              with urllib.request.urlopen(req,timeout=12) as r:
                raw=r.read(400000);print("CHECK",label,"HTTP",r.status,"SIZE",len(raw),"CT",r.headers.get("content-type"))
                if b"<rss" in raw[:300] or b"<?xml" in raw[:200]:
                  root=ET.fromstring(raw);items=root.findall(".//item")
                  print("ITEM_COUNT",len(items))
                  for item in items[:6]: print("ITEM_LINK",item.findtext("link","")[:190])
                else: print("RESPONSE",raw[:260].decode("utf-8","replace"))
            except urllib.error.HTTPError as e:print("CHECK",label,"HTTP_ERROR",e.code,e.read(160).decode("utf-8","replace"))
            except Exception as e:print("CHECK",label,"ERROR",repr(e)[:200])
          PY
